<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#11131d" />
<title>오늘, 너에게 · 인터랙티브 폰 스토리</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#172029;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0e1119;display:flex;align-items:center;justify-content:center}.phone{width:min(100%,430px);height:100dvh;min-height:600px;max-height:920px;position:relative;overflow:hidden;background:#fff;isolation:isolate;box-shadow:0 20px 80px #0007}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #6b93fa;outline-offset:2px}.status{height:57px;position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;padding:12px 29px 0;font-size:14px;font-weight:700;color:#10141f;pointer-events:none}.status.dark{color:white}.signal{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:-1px}.battery{width:25px;height:12px;border:1.7px solid currentColor;border-radius:4px;position:relative;margin-left:2px}.battery:after{content:'';position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}.battery:before{content:'';position:absolute;inset:2px 5px 2px 2px;background:currentColor;border-radius:1px}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:104px;height:28px;background:#101015;border-radius:19px}.view{height:100%;overflow:hidden;position:relative}.gesture{position:absolute;z-index:13;width:116px;height:5px;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);border-radius:6px;background:#202331;cursor:pointer}.gesture.light{background:white}.intro{background:linear-gradient(155deg,#f4f4fc,#e3eafa 57%,#dfd4e9);height:100%;overflow:auto;padding:120px 28px 58px}.intro .eyebrow{color:#687590;font-size:12px;font-weight:800;letter-spacing:2px}.intro h1{font-size:32px;line-height:1.35;letter-spacing:-1.7px;margin:15px 0}.intro p{color:#697386;line-height:1.65;margin:0 0 28px;font-size:14px}.pick{background:#ffffffdc;border:1px solid #ffffff;border-radius:23px;padding:20px;display:flex;align-items:center;gap:16px;text-align:left;width:100%;margin:13px 0;box-shadow:0 10px 25px #35447212;transition:transform .15s,box-shadow .15s}.pick:active{transform:scale(.98)}.avatar{width:58px;height:58px;border-radius:22px;flex-shrink:0;display:grid;place-items:center;font-size:23px;font-weight:800}.avatar.jaeho{background:#263041;color:#f0f2f6}.avatar.sangwon{background:#c6d6fc;color:#38446a}.pick strong{display:block;font-size:18px;margin-bottom:5px}.pick small{color:#8791a2}.pick .chev{margin-left:auto;font-size:25px;color:#939cac}.intro-footer{text-align:center;color:#8993a3;font-size:12px;margin-top:23px}.homescreen{height:100%;position:relative;color:#fff;background:radial-gradient(ellipse at 78% 12%,#f9c3c9 0%,transparent 46%),radial-gradient(ellipse at 14% 74%,#8394e9 0%,transparent 58%),linear-gradient(155deg,#4d5d95,#a8a2c7 51%,#eab7bc)}.home-clock{padding-top:105px;text-align:center;font-size:70px;font-weight:200;letter-spacing:-3px;text-shadow:0 2px 12px #3332}.home-date{text-align:center;font-size:16px;font-weight:550;margin-top:-4px}.home-apps{position:absolute;left:0;right:0;top:42%;display:grid;grid-template-columns:repeat(4,1fr);gap:26px 4px;padding:0 20px}.app-tile{background:none;border:0;color:#fff;text-align:center;font-size:11px;text-shadow:0 1px 5px #13142d50;padding:0}.app-icon{position:relative;width:62px;height:62px;margin:0 auto 8px;border-radius:16px;background:white;display:grid;place-items:center;font-size:31px;box-shadow:0 6px 17px #1c275d30;color:#19222f}.app-icon.kakao{background:#fee500;color:#333;font-weight:900;font-size:16px;letter-spacing:-2px}.app-icon.message,.app-icon.phoneapp{background:#43cd73;color:white}.app-icon.photo{background:linear-gradient(160deg,#ffffff,#f2f4ff)}.app-icon.notes{background:#fff;color:#e8b938}.app-icon.settings{background:#727e94;color:#fff}.app-dot{position:absolute;top:-6px;right:-7px;background:#f6545a;color:white;border-radius:999px;min-width:19px;height:19px;padding:2px 5px;font-size:11px;font-weight:700;display:grid;place-items:center}.dock{position:absolute;left:20px;right:20px;bottom:39px;border-radius:29px;background:#ffffff66;display:flex;justify-content:space-evenly;padding:14px 6px;backdrop-filter:blur(18px)}.dock .app-icon{width:57px;height:57px;margin:0}.notification{position:absolute;left:18px;right:18px;top:69px;z-index:5;background:#f5f7fbdf;color:#202837;padding:14px 16px;border-radius:21px;display:flex;align-items:flex-start;gap:11px;text-align:left;border:1px solid #ffffff80;box-shadow:0 15px 35px #12192a2b;backdrop-filter:blur(15px)}.notification .ntext{flex:1}.notification strong{font-size:13px}.notification p{font-size:13px;line-height:1.5;margin:5px 0 0}.notification small{font-size:10px;color:#798393}.notification-icon{height:36px;width:36px;border-radius:12px;background:#fee500;display:grid;place-items:center;font-size:11px;font-weight:900}.app-page{height:100%;padding-top:59px;background:#fff;display:flex;flex-direction:column}.app-header{height:63px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 19px;border-bottom:1px solid #f2f3f5}.navback,.topicon{background:none;border:0;padding:6px;color:#26313c;font-size:29px}.app-header h2{font-size:19px;letter-spacing:-.5px;margin:0;flex:1}.app-header small{color:#98a1ac;font-weight:400;font-size:11px}.chat-list{flex:1;overflow:auto}.chat-preview{border:0;background:#fff;display:flex;width:100%;text-align:left;align-items:center;gap:14px;padding:18px 21px}.preview-avatar{height:57px;width:57px;border-radius:21px;display:grid;place-items:center;font-weight:800;font-size:19px;color:white;background:#394358}.preview-avatar.sangwon{background:#a5bbeb;color:#313f5a}.chat-preview strong{font-size:16px}.chat-preview p{margin:6px 0;color:#808a96;font-size:13px}.preview-right{margin-left:auto;text-align:right;align-self:flex-start;color:#a2aab5;font-size:11px}.preview-right b{display:inline-grid;place-items:center;margin-top:8px;border-radius:999px;background:#f15a61;color:#fff;height:19px;min-width:19px}.chat-page{height:100%;padding-top:59px;display:flex;flex-direction:column;background:#b5c5d0}.chat-page.sms{background:#f6f7fa}.chat-page .app-header{border:0;background:#b5c5d0}.chat-page.sms .app-header{background:#fff;border-bottom:1px solid #ededf2}.conversation{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:20px 15px 20px;overscroll-behavior:contain}.chat-date{text-align:center;color:#516171;font-size:11px;margin:2px auto 12px;background:#ffffff48;border-radius:15px;padding:6px 12px}.bubble-row{display:flex;gap:8px;align-items:flex-end;max-width:90%}.bubble-row.mine{align-self:flex-end;justify-content:flex-end}.bubble-row.theirs{align-self:flex-start}.bubble{font-size:14px;line-height:1.55;padding:11px 14px;border-radius:16px;white-space:pre-line;box-shadow:0 2px 3px #3846520a;word-break:keep-all}.mine .bubble{background:#fee500;border-top-right-radius:5px}.theirs .bubble{background:#fff;border-top-left-radius:5px}.sms .mine .bubble{background:#43b563;color:#fff;border-radius:20px}.sms .theirs .bubble{background:#e7e8ed;border-radius:20px}.bubble-time{font-size:10px;color:#5c6b77;white-space:nowrap}.option-area{background:#ffffffd9;padding:12px 13px max(28px,env(safe-area-inset-bottom));border-top:1px solid #dae0e5;flex-shrink:0}.option-help{color:#8c98a5;font-size:11px;margin:0 4px 9px}.option{width:100%;background:#fff;border:1px solid #d6dce5;border-radius:15px;padding:12px 14px;text-align:left;font-size:13px;color:#27303c;margin:4px 0;transition:background .15s}.option:active{background:#eff3fc}.option.disabled{color:#aaa}.app-page .content{padding:24px;overflow:auto;flex:1}.settings-row{width:100%;padding:20px 0;background:none;border:0;border-bottom:1px solid #edf0f4;text-align:left;font-size:15px}.soft{color:#7c8797;font-size:13px;line-height:1.7}.call-screen{height:100%;background:linear-gradient(160deg,#2c344b,#131923 65%,#181c27);color:white;position:relative;text-align:center;padding:113px 20px 30px}.call-caption{font-size:13px;color:#b5c0d0;margin-bottom:12px}.call-name{font-size:34px;font-weight:500;margin:0}.call-lines{min-height:110px;max-width:300px;margin:65px auto 20px;line-height:1.85;font-size:17px;white-space:pre-line}.call-controls{position:absolute;bottom:85px;left:0;right:0;display:flex;justify-content:center;gap:54px}.circle{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:0;background:#ff5961;color:#fff;font-size:29px}.circle.accept{background:#36c66b}.call-control-label{font-size:12px;color:#d3dbe7;margin-top:11px}.call-continue{border:1px solid #ffffff5a;background:#ffffff15;color:#fff;border-radius:30px;padding:12px 23px;font-size:14px}.ending{height:100%;padding:150px 35px 70px;text-align:center;background:linear-gradient(155deg,#fff9f1,#e6eafb)}.ending .star{font-size:38px}.ending h2{font-size:29px;margin:15px 0}.ending p{line-height:1.9;font-size:15px;color:#4e5a6b;white-space:pre-line}.primary{border:0;background:#252e45;color:white;padding:15px 23px;border-radius:15px;font-size:14px;margin-top:32px;width:100%}.ghost{border:0;background:none;color:#6d7890;padding:15px;font-size:13px;width:100%}.loading{font-size:13px;color:#6c7580;padding:10px}.photo-card{background:#eee9e6;border-radius:18px;padding:35px 25px;text-align:center;line-height:1.7;color:#7b7880}.muted-line{height:1px;background:#edf0f4;margin:20px 0}@media(min-width:520px){body{padding:20px}.phone{border:7px solid #333b4a;border-radius:46px;max-height:880px;box-shadow:0 30px 90px #0009}.status{top:3px}.gesture{bottom:12px}}@media(max-height:700px){.home-apps{top:40%;gap:17px 4px}.home-clock{padding-top:82px}.intro{padding-top:95px}.call-lines{margin-top:35px}.call-screen{padding-top:90px}}
</style>
</head>
<body>
<div class="phone" id="phone">
<div class="status" id="status"><span id="clock">9:41</span><span class="island"></span><span class="signal"><span>▂▄▆</span><span>5G</span><span class="battery"></span></span></div>
<div class="view" id="view" aria-live="polite"></div>
<div class="gesture" id="gesture" role="button" aria-label="홈 화면으로 이동" tabindex="0"></div>
</div>
<script>
'use strict';
const CHARACTERS={
  jaeho:{name:'김재호',initial:'재',description:'담백하지만 은근히 다정한 재호',hello:'퇴근했어? 오늘 좀 늦는다고 했지',first:['응, 이제 막 끝났어','아직 회사야 ㅠㅠ'],responses:[['고생했네. 저녁은 먹었고?','먹었으면 좋겠는데. 근처면 내가 갈게'],['그럼 너무 무리하지 말고','일 끝나면 연락 줘. 기다릴게']],second:['아직 못 먹었어','나 오늘 좀 보고 싶어'],secondResponses:[['그럴 줄 알았다','먹고 싶은 거 생각해 둬. 내가 데리러 갈게'],['나도','말할까 하다가 방해될까 봐 참았어']],third:['그럼 전화해 줄래?','나도 너 보러 갈게'],callIntro:'소담아, 이제 내 목소리 들려?\n피곤할 텐데 잠깐만 통화하자',callNext:'오늘 힘들었지.\n괜찮으면 내가 갈게, 얼굴 보고 싶어서',end:'별일 없는 하루였는데\n네 목소리 하나로 조금 달라졌어.\n\n오늘은 재호가 널 데리러 오는 날',sms:'집 앞에 도착하면 연락할게. 천천히 나와',smsAnswer:'응, 기다릴게'},
  sangwon:{name:'서상원',initial:'상',description:'장난스럽고 살뜰하게 챙겨주는 상원',hello:'소담아 뭐해 ㅎㅎ\n나 오늘 너 볼 수 있어?',first:['나 지금 퇴근하는 중!','왜애~ 나 보고 싶어? ㅋㅋ'],responses:[['아이고 오늘도 고생했네 ㅎㅎ','그럼 내가 맛있는 거 사줘야겠는데?'],['들켰네 ㅋㅋㅋㅋ','응, 보고 싶어. 많이 ㅎㅎ']],second:['나도 보고 싶었어','뭐 먹을까?'],secondResponses:[['그럼 오늘 우리 꼭 보자','나 지금 꽤 신났음 ㅋㅋ'],['네가 먹고 싶은 거!','대신 나랑 같이 먹어주기 ㅎㅎ']],third:['목소리 듣고 싶다','그럼 얼른 와 ㅋㅋ'],callIntro:'소담아아~ ㅎㅎ\n아 드디어 목소리 듣네',callNext:'나 아까부터 너 보려고 준비하고 있었어\n우리 오늘 맛있는 거 먹고 산책도 할까?',end:'퇴근길이 조금 덜 피곤해지는 마법.\n\n오늘은 상원이가 잔뜩 들뜬 채\n널 만나러 오는 날',sms:'소담아 나 거의 다 왔어! 천천히 나와 ㅎㅎ',smsAnswer:'ㅋㅋㅋ 응 곧 나갈게'}
};
const STORE='sodam-iphone-mini-story-v2';
let state={character:null,step:0,history:[],smsHistory:[],smsRead:false,callState:'none',callStep:0,finished:false,screen:'intro'};
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&CHARACTERS[saved.character])state={...state,...saved,screen:'home'}}catch(e){}
const view=document.getElementById('view'),status=document.getElementById('status'),gesture=document.getElementById('gesture');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify({...state,screen:'home'}))}catch(e){}}
const c=()=>CHARACTERS[state.character];
const btn=(label,act,cls='')=>`<button type="button" class="${cls}" data-action="${act}">${esc(label)}</button>`;
function time(){return new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:false})}
function today(){return new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}
function setDark(yes){status.classList.toggle('dark',yes);gesture.classList.toggle('light',yes)}
function showIntro(){state.screen='intro';setDark(false);view.innerHTML=`<div class="intro"><div class="eyebrow">A LITTLE STORY, IN YOUR PHONE</div><h1>오늘, 너에게<br>메시지가 왔어</h1><p>누구와 이야기를 시작할까?<br>이름을 고르면 작은 하루가 시작돼</p>${Object.entries(CHARACTERS).map(([key,ch])=>`<button class="pick" data-action="select:${key}"><span class="avatar ${key}">${ch.initial}</span><span><strong>${ch.name}</strong><small>${ch.description}</small></span><span class="chev">›</span></button>`).join('')}<div class="intro-footer">선택은 언제든 설정에서 변경할 수 있어</div></div>`}
function select(key){state={character:key,step:0,history:[{side:'them',text:CHARACTERS[key].hello}],smsHistory:[],smsRead:false,callState:'none',callStep:0,finished:false,screen:'home'};persist();home()}
function appIcon(name,symbol,color,action,dot=false){return `<button class="app-tile" data-action="${action}"><div class="app-icon ${color}">${symbol}${dot?'<span class="app-dot">1</span>':''}</div>${name}</button>`}
function home(){if(!state.character){showIntro();return}state.screen='home';persist();setDark(true);view.innerHTML=`<div class="homescreen"><div class="home-clock">${time()}</div><div class="home-date">${today()}</div><div class="home-apps">${appIcon('카카오톡','TALK','kakao','kakao',!state.finished&&state.step===0)}${appIcon('메시지','☏','message','sms',state.smsHistory.length>0&&!state.smsRead)}${appIcon('전화','☎','phoneapp','phone',state.callState==='incoming')}${appIcon('사진','✿','photo','photos')}${appIcon('메모','▤','notes','notes')}${appIcon('설정','⚙','settings','settings')}</div><div class="dock">${appIcon('','☎','phoneapp','phone')}${appIcon('','TALK','kakao','kakao')}${appIcon('','☏','message','sms')}${appIcon('','⚙','settings','settings')}</div>${state.callState==='incoming'?`<button class="notification" data-action="phone"><span class="notification-icon" style="background:#43cd73;color:white">☎</span><span class="ntext"><strong>수신 전화 · ${c().name}</strong><p>전화가 오고 있어...</p></span></button>`:state.step===0?`<button class="notification" data-action="kakao"><span class="notification-icon">TALK</span><span class="ntext"><strong>카카오톡 · ${c().name}</strong><small style="float:right">지금</small><p>${esc(c().hello)}</p></span></button>`:state.smsHistory.length&&!state.smsRead?`<button class="notification" data-action="sms"><span class="notification-icon" style="background:#43cd73;color:white">☏</span><span class="ntext"><strong>메시지 · ${c().name}</strong><p>${esc(c().sms)}</p></span></button>`:''}</div>`}
function appPage(title,inner){setDark(false);view.innerHTML=`<div class="app-page"><header class="app-header">${btn('‹','home','navback')}<h2>${esc(title)}</h2></header>${inner}</div>`}
function kakao(){state.screen='kakao';setDark(false);view.innerHTML=`<div class="app-page"><header class="app-header">${btn('‹','home','navback')}<h2>채팅</h2><span class="topicon" style="font-size:20px">⌕</span></header><div class="chat-list"><button class="chat-preview" data-action="chat"><div class="preview-avatar ${state.character}">${c().initial}</div><span><strong>${c().name}</strong><p>${esc(state.history.at(-1)?.text||c().hello).slice(0,34)}</p></span><span class="preview-right">${time()}${state.step===0?'<br><b>1</b>':''}</span></button></div></div>`}
function chat(){state.screen='chat';setDark(false);view.innerHTML=`<div class="chat-page"><header class="app-header">${btn('‹','kakao','navback')}<h2>${c().name}</h2><small>카카오톡</small></header><div class="conversation" id="conversation"><div class="chat-date">${today()}</div>${state.history.map(h=>`<div class="bubble-row ${h.side==='me'?'mine':'theirs'}"><span class="bubble">${esc(h.text)}</span><span class="bubble-time">${time()}</span></div>`).join('')}</div><div class="option-area"><div class="option-help">${state.step<3?'답장을 골라봐':'메시지'}</div>${choices()}</div></div>`;const el=document.getElementById('conversation');if(el)el.scrollTop=el.scrollHeight}
function choices(){if(state.step===0)return c().first.map((t,i)=>btn(t,`reply:${i}`,'option')).join('');if(state.step===1)return c().second.map((t,i)=>btn(t,`reply:${i}`,'option')).join('');if(state.step===2)return c().third.map((t,i)=>btn(t,`reply:${i}`,'option')).join('');if(state.callState==='incoming')return btn('📞 전화가 오고 있어! 받으러 가기','phone','option');if(state.finished)return btn('스토리 다시 보기','ending','option');return '<div class="loading">잠시 후 전화가 올 거야...</div>'}
function reply(index){if(state.step>2)return;let step=state.step;let msg=step===0?c().first[index]:step===1?c().second[index]:c().third[index];state.history.push({side:'me',text:msg});if(step===0||step===1){const lines=(step===0?c().responses:c().secondResponses)[index];lines.forEach(line=>state.history.push({side:'them',text:line}))}else{state.history.push({side:'them',text:index===0?'잠깐만. 지금 걸게':'좋아. 그런데 목소리부터 듣고 싶다 ㅎㅎ'});state.callState='incoming'}state.step++;persist();chat()}
function phone(){state.screen='phone';if(state.callState==='none'){appPage('전화',`<div class="content"><p class="soft">아직 통화 기록이 없어<br>카카오톡에서 ${c().name}와 먼저 이야기해 봐</p>${btn('카카오톡 열기','kakao','primary')}</div>`);return}if(state.callState==='done'){appPage('최근 통화',`<div class="content"><div class="settings-row">${c().name}<span style="float:right;color:#999;font-size:12px">통화 완료</span></div>${btn('마지막 장면 보기','ending','primary')}</div>`);return}setDark(true);const incoming=state.callState==='incoming';view.innerHTML=`<div class="call-screen"><div class="call-caption">${incoming?'전화가 걸려오는 중...':'통화 중 · 00:24'}</div><h1 class="call-name">${c().name}</h1><div class="call-lines">${incoming?'📞':esc(state.callStep===0?c().callIntro:c().callNext)}</div>${incoming?`<div class="call-controls"><div>${btn('✕','decline','circle')}<div class="call-control-label">거절</div></div><div>${btn('☎','accept','circle accept')}<div class="call-control-label">응답</div></div></div>`:state.callStep===0?btn('소담: 응, 나도 보고 싶었어','next-call','call-continue'):`<div class="call-controls"><div>${btn('☎','finish-call','circle')}<div class="call-control-label">통화 종료</div></div></div>`}</div>`}
function accept(){state.callState='active';state.callStep=0;persist();phone()}
function nextCall(){state.callStep=1;persist();phone()}
function finishCall(){state.callState='done';state.finished=true;state.smsHistory=[{side:'them',text:c().sms}];state.smsRead=false;persist();ending()}
function sms(){state.screen='sms';state.smsRead=true;persist();if(!state.smsHistory.length){appPage('메시지',`<div class="content"><h3 style="margin-top:0">메시지</h3><p class="soft">아직 도착한 문자가 없어<br>카카오톡에서 이야기하다 보면 새로운 문자가 올지도?</p>${btn('카카오톡 열기','kakao','primary')}</div>`);return}setDark(false);view.innerHTML=`<div class="chat-page sms"><header class="app-header">${btn('‹','home','navback')}<h2>${c().name}</h2><small>문자</small></header><div class="conversation" id="conversation"><div class="chat-date">오늘 ${time()}</div>${state.smsHistory.map(h=>`<div class="bubble-row ${h.side==='me'?'mine':'theirs'}"><span class="bubble">${esc(h.text)}</span></div>`).join('')}</div><div class="option-area">${state.smsHistory.length===1?btn(c().smsAnswer,'sms-reply','option'):'<div class="option-help">대화를 마쳤어 ♡</div>'}</div></div>`}
function smsReply(){state.smsHistory.push({side:'me',text:c().smsAnswer});persist();sms()}
function ending(){state.screen='ending';setDark(false);view.innerHTML=`<div class="ending"><div class="star">✦</div><h2>오늘, 너에게</h2><p>${esc(c().end)}</p>${btn('홈 화면으로 돌아가기','home','primary')}${btn('다른 사람의 이야기 보기','reset','ghost')}</div>`}
function settings(){state.screen='settings';appPage('설정',`<div class="content"><h3>스토리 설정</h3><p class="soft">현재 이야기 상대 · <strong>${c().name}</strong></p>${btn('캐릭터 바꾸기 / 처음부터 시작','reset','settings-row')}<div class="muted-line"></div><p class="soft">짧은 인터랙티브 연애 스토리<br>브라우저에 자동 저장돼서 다시 열어도 이어할 수 있어</p></div>`)}
function photos(){state.screen='photos';appPage('사진',`<div class="content"><div class="photo-card">✿<br><br>오늘의 기억<br><small>기억은 사진보다 조금 먼저 도착하기도 해</small></div>${btn('홈 화면','home','ghost')}</div>`)}
function notes(){state.screen='notes';appPage('메모',`<div class="content"><div class="photo-card" style="background:#fff9d7">오늘 할 일<br><br>✓ 퇴근하기<br>□ 좋아하는 사람 만나기<br>□ 맛있는 저녁 먹기</div></div>`)}
function reset(){if(confirm('대화 기록을 초기화하고 다른 캐릭터를 고를까?')){state={character:null,step:0,history:[],smsHistory:[],smsRead:false,callState:'none',callStep:0,finished:false,screen:'intro'};try{localStorage.removeItem(STORE)}catch(e){}showIntro()}}
function decline(){state.callState='incoming';persist();home()}
const handlers={home,kakao,chat,phone,sms,photos,notes,settings,accept,'next-call':nextCall,'finish-call':finishCall,'sms-reply':smsReply,ending,reset,decline};
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action.startsWith('select:'))select(action.split(':')[1]);else if(action.startsWith('reply:'))reply(Number(action.split(':')[1]));else if(handlers[action])handlers[action]()});
gesture.addEventListener('click',home);gesture.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();home()}});function updateClock(){document.getElementById('clock').textContent=time();if(state.screen==='home'){const e=document.querySelector('.home-clock');if(e)e.textContent=time()}}updateClock();setInterval(updateClock,30000);state.character?home():showIntro();
</script>
</body>
</html>
