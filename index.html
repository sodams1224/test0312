const view=document.getElementById('view'),status=document.getElementById('status'),gesture=document.getElementById('gesture');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify({...state,screen:'home'}))}catch(e){}}
// 마지막 한글 글자의 종성(받침) 유무로 자연스러운 호칭 만들기
function callName(playerName=state.playerName){
  const name=(playerName||'소담').trim();
  const last=name.charCodeAt(name.length-1);
  const isHangul=last>=0xAC00&&last<=0xD7A3;
  const hasBatchim=isHangul&&(last-0xAC00)%28!==0;
  return name+(hasBatchim?'아':'야');
}
function fillName(text,playerName=state.playerName){
  const name=(playerName||'소담').trim();
  return text.replace(/소담아아/g,()=>callName(name)+'아')
             .replace(/소담아/g,()=>callName(name))
             .replace(/소담/g,()=>name);
}
function localize(obj){if(typeof obj==='string')return fillName(obj);if(Array.isArray(obj))return obj.map(localize);if(obj&&typeof obj==='object')return Object.fromEntries(Object.entries(obj).map(([key,value])=>[key,localize(value)]));return obj}
const c=()=>localize(CHARACTERS[state.character]);
const btn=(label,act,cls='')=>`<button type="button" class="${cls}" data-action="${act}">${esc(label)}</button>`;
function time(){return new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:false})}
function today(){return new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}
function setDark(yes){status.classList.toggle('dark',yes);gesture.classList.toggle('light',yes)}
function showIntro(){state.screen='intro';setDark(false);view.innerHTML=`<div class="intro"><div class="eyebrow">A LITTLE STORY, IN YOUR PHONE</div><h1>오늘, 너에게<br>메시지가 왔어</h1><p>너의 이름을 입력하고<br>이야기할 상대를 골라봐</p><div class="name-card"><label for="player-name">플레이어 이름</label><input id="player-name" type="text" maxlength="12" autocomplete="nickname" placeholder="예: 소담, 지민, 수아" value="${esc(state.playerName||'')}"><small>입력한 이름으로 카톡, 전화 대사가 바뀌어</small></div>${Object.entries(CHARACTERS).map(([key,ch])=>`<button class="pick" data-action="select:${key}"><span class="avatar ${key}">${ch.initial}</span><span><strong>${ch.name}</strong><small>${ch.description}</small></span><span class="chev">›</span></button>`).join('')}<div class="intro-footer">선택은 언제든 설정에서 변경할 수 있어</div></div>`}
function select(key){const input=document.getElementById('player-name');const name=(input?.value||'').trim();if(!name){alert('먼저 플레이어 이름을 입력해 줘!');input?.focus();return}state={character:key,playerName:name,step:0,history:[{side:'them',text:fillName(CHARACTERS[key].hello,name)}],smsHistory:[],smsRead:false,callState:'none',callStep:0,finished:false,screen:'home'};persist();home()}
function appIcon(name,symbol,color,action,dot=false){return `<button class="app-tile" data-action="${action}"><div class="app-icon ${color}">${symbol}${dot?'<span class="app-dot">1</span>':''}</div>${name}</button>`}
function home(){if(!state.character){showIntro();return}state.screen='home';persist();setDark(true);view.innerHTML=`<div class="homescreen"><div class="home-clock">${time()}</div><div class="home-date">${today()}</div><div class="home-apps">${appIcon('카카오톡','TALK','kakao','kakao',!state.finished&&state.step===0)}${appIcon('메시지','☏','message','sms',state.smsHistory.length>0&&!state.smsRead)}${appIcon('전화','☎','phoneapp','phone',state.callState==='incoming')}${appIcon('사진','✿','photo','photos')}${appIcon('메모','▤','notes','notes')}${appIcon('설정','⚙','settings','settings')}</div><div class="dock">${appIcon('','☎','phoneapp','phone')}${appIcon('','TALK','kakao','kakao')}${appIcon('','☏','message','sms')}${appIcon('','⚙','settings','settings')}</div>${state.callState==='incoming'?`<button class="notification" data-action="phone"><span class="notification-icon" style="background:#43cd73;color:white">☎</span><span class="ntext"><strong>수신 전화 · ${c().name}</strong><p>전화가 오고 있어...</p></span></button>`:state.step===0?`<button class="notification" data-action="kakao"><span class="notification-icon">TALK</span><span class="ntext"><strong>카카오톡 · ${c().name}</strong><small style="float:right">지금</small><p>${esc(c().hello)}</p></span></button>`:state.smsHistory.length&&!state.smsRead?`<button class="notification" data-action="sms"><span class="notification-icon" style="background:#43cd73;color:white">☏</span><span class="ntext"><strong>메시지 · ${c().name}</strong><p>${esc(c().sms)}</p></span></button>`:''}</div>`}
function appPage(title,inner){setDark(false);view.innerHTML=`<div class="app-page"><header class="app-header">${btn('‹','home','navback')}<h2>${esc(title)}</h2></header>${inner}</div>`}
function kakao(){state.screen='kakao';setDark(false);view.innerHTML=`<div class="app-page"><header class="app-header">${btn('‹','home','navback')}<h2>채팅</h2><span class="topicon" style="font-size:20px">⌕</span></header><div class="chat-list"><button class="chat-preview" data-action="chat"><div class="preview-avatar ${state.character}">${c().initial}</div><span><strong>${c().name}</strong><p>${esc(state.history.at(-1)?.text||c().hello).slice(0,34)}</p></span><span class="preview-right">${time()}${state.step===0?'<br><b>1</b>':''}</span></button></div></div>`}
function chat(){state.screen='chat';setDark(false);view.innerHTML=`<div class="chat-page"><header class="app-header">${btn('‹','kakao','navback')}<h2>${c().name}</h2><small>카카오톡</small></header><div class="conversation" id="conversation"><div class="chat-date">${today()}</div>${state.history.map(h=>`<div class="bubble-row ${h.side==='me'?'mine':'theirs'}"><span class="bubble ${h.image?'photo-bubble':''}">${h.image==='egg-tart'?`<img class="chat-photo" src="${EGG_TART_IMAGE}" alt="재호가 보낸 에그타르트 사진" />`:esc(h.text)}</span><span class="bubble-time">${time()}</span></div>`).join('')}</div><div class="option-area"><div class="option-help">${state.step<3?'답장을 골라봐':'메시지'}</div>${choices()}</div></div>`;const el=document.getElementById('conversation');if(el)el.scrollTop=el.scrollHeight}
function choices(){if(state.step===0)return c().first.map((t,i)=>btn(t,`reply:${i}`,'option')).join('');if(state.step===1)return c().second.map((t,i)=>btn(t,`reply:${i}`,'option')).join('');if(state.step===2)return c().third.map((t,i)=>btn(t,`reply:${i}`,'option')).join('');if(state.callState==='incoming')return btn('📞 전화가 오고 있어! 받으러 가기','phone','option');if(state.finished)return btn('스토리 다시 보기','ending','option');return '<div class="loading">잠시 후 전화가 올 거야...</div>'}
function reply(index){
  if(state.step>2)return;
  const step=state.step;
  const ch=c();
  const msg=step===0?ch.first[index]:step===1?ch.second[index]:ch.third[index];
  state.history.push({side:'me',text:msg});
  if(step===0||step===1){
    const lines=(step===0?ch.responses:ch.secondResponses)[index];
    lines.forEach(line=>state.history.push({side:'them',text:line}));
    if(state.character==='jaeho'&&step===0){
      state.history.push({side:'them',image:'egg-tart'});
      ch.afterFirst.forEach(line=>state.history.push({side:'them',text:line}));
    }
  }else{
    const line=ch.thirdResponses?.[index]||[index===0?'잠깐만. 지금 걸게':'좋아. 그런데 목소리부터 듣고 싶다 ㅎㅎ'];
    line.forEach(text=>state.history.push({side:'them',text}));
    state.callState='incoming';
  }
  state.step++;
  persist();chat();
}
function phone(){state.screen='phone';if(state.callState==='none'){appPage('전화',`<div class="content"><p class="soft">아직 통화 기록이 없어<br>카카오톡에서 ${c().name}와 먼저 이야기해 봐</p>${btn('카카오톡 열기','kakao','primary')}</div>`);return}if(state.callState==='done'){appPage('최근 통화',`<div class="content"><div class="settings-row">${c().name}<span style="float:right;color:#999;font-size:12px">통화 완료</span></div>${btn('마지막 장면 보기','ending','primary')}</div>`);return}setDark(true);const incoming=state.callState==='incoming';view.innerHTML=`<div class="call-screen"><div class="call-caption">${incoming?'전화가 걸려오는 중...':'통화 중 · 00:24'}</div><h1 class="call-name">${c().name}</h1><div class="call-lines">${incoming?'📞':esc(state.callStep===0?c().callIntro:c().callNext)}</div>${incoming?`<div class="call-controls"><div>${btn('✕','decline','circle')}<div class="call-control-label">거절</div></div><div>${btn('☎','accept','circle accept')}<div class="call-control-label">응답</div></div></div>`:state.callStep===0?btn(`${state.playerName}: ${c().callAnswer||'응, 나도 보고 싶었어'}`,'next-call','call-continue'):`<div class="call-controls"><div>${btn('☎','finish-call','circle')}<div class="call-control-label">통화 종료</div></div></div>`}</div>`}
function accept(){state.callState='active';state.callStep=0;persist();phone()}
function nextCall(){state.callStep=1;persist();phone()}
function finishCall(){state.callState='done';state.finished=true;state.smsHistory=[{side:'them',text:c().sms}];state.smsRead=false;persist();ending()}
function sms(){state.screen='sms';state.smsRead=true;persist();if(!state.smsHistory.length){appPage('메시지',`<div class="content"><h3 style="margin-top:0">메시지</h3><p class="soft">아직 도착한 문자가 없어<br>카카오톡에서 이야기하다 보면 새로운 문자가 올지도?</p>${btn('카카오톡 열기','kakao','primary')}</div>`);return}setDark(false);view.innerHTML=`<div class="chat-page sms"><header class="app-header">${btn('‹','home','navback')}<h2>${c().name}</h2><small>문자</small></header><div class="conversation" id="conversation"><div class="chat-date">오늘 ${time()}</div>${state.smsHistory.map(h=>`<div class="bubble-row ${h.side==='me'?'mine':'theirs'}"><span class="bubble">${esc(h.text)}</span></div>`).join('')}</div><div class="option-area">${state.smsHistory.length===1?btn(c().smsAnswer,'sms-reply','option'):'<div class="option-help">대화를 마쳤어 ♡</div>'}</div></div>`}
function smsReply(){state.smsHistory.push({side:'me',text:c().smsAnswer});persist();sms()}
function ending(){state.screen='ending';setDark(false);view.innerHTML=`<div class="ending"><div class="star">✦</div><h2>오늘, 너에게</h2><p>${esc(c().end)}</p>${btn('홈 화면으로 돌아가기','home','primary')}${btn('다른 사람의 이야기 보기','reset','ghost')}</div>`}
function settings(){state.screen='settings';appPage('설정',`<div class="content"><h3>스토리 설정</h3><p class="soft">플레이어 · <strong>${esc(state.playerName||'소담')}</strong><br>현재 이야기 상대 · <strong>${c().name}</strong></p>${btn('캐릭터 바꾸기 / 처음부터 시작','reset','settings-row')}<div class="muted-line"></div><p class="soft">짧은 인터랙티브 연애 스토리<br>브라우저에 자동 저장돼서 다시 열어도 이어할 수 있어</p></div>`)}
function photos(){state.screen='photos';appPage('사진',`<div class="content"><div class="photo-card">✿<br><br>오늘의 기억<br><small>기억은 사진보다 조금 먼저 도착하기도 해</small></div>${btn('홈 화면','home','ghost')}</div>`)}
function notes(){state.screen='notes';appPage('메모',`<div class="content"><div class="photo-card" style="background:#fff9d7">오늘 할 일<br><br>✓ 퇴근하기<br>□ 좋아하는 사람 만나기<br>□ 맛있는 저녁 먹기</div></div>`)}
function reset(){if(confirm('대화 기록을 초기화하고 다른 캐릭터를 고를까?')){state={character:null,playerName:'',step:0,history:[],smsHistory:[],smsRead:false,callState:'none',callStep:0,finished:false,screen:'intro'};try{localStorage.removeItem(STORE)}catch(e){}showIntro()}}
function decline(){state.callState='incoming';persist();home()}
const handlers={home,kakao,chat,phone,sms,photos,notes,settings,accept,'next-call':nextCall,'finish-call':finishCall,'sms-reply':smsReply,ending,reset,decline};
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action.startsWith('select:'))select(action.split(':')[1]);else if(action.startsWith('reply:'))reply(Number(action.split(':')[1]));else if(handlers[action])handlers[action]()});
gesture.addEventListener('click',home);gesture.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();home()}});function updateClock(){document.getElementById('clock').textContent=time();if(state.screen==='home'){const e=document.querySelector('.home-clock');if(e)e.textContent=time()}}updateClock();setInterval(updateClock,30000);state.character?home():showIntro();
</script>
</body>
</html>
